# ==============================================================================
# 檔案名稱：docker-compose.yml
# 專案名稱：學生就學貸款 PDF 解析與歸檔服務 - Docker 服務編排設定檔
# 說明：
#    本設定檔供 QNAP NAS Container Station 建立與管理 Python Flask 解析容器。
#    將 NAS 本機實體路徑映射至容器內部，並將容器內部的 5000 Port 映射至外部的 55000 Port。
# ==============================================================================

version: '3.8'

services:
  # PDF 解析與文字萃取 API 服務
  pdf_parser_api:
    build: .                        # 依據同目錄下的 Dockerfile 建立映像檔
    container_name: pdf_parser_api  # 容器自訂名稱
    restart: always                 # NAS 重開機或服務異常終止時自動重啟
    ports:
      # 主機外部連接埠 : 容器內部連接埠
      - "55000:5000"
    volumes:
      # 關鍵掛載 1：將主機當前目錄的 app.py 直接掛載映射至容器內部
      # 好處：日後只要在 NAS 替換更新 app.py，重啟容器即可 100% 立即生效，徹底杜絕 Docker Image 舊代碼快取問題！
      - ./app.py:/app/app.py
      # 關鍵掛載 2：將 QNAP NAS 實體目錄掛載映射至容器內的 /app/saved_pdfs
      # 注意：程式會自動在該目錄下建立學期專屬子目錄（例如：115-1/）
      - /share/CACHEDEV2_DATA/課外組公用/【就貸專區】/PDF:/app/saved_pdfs
